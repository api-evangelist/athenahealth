summary:
  asserted: 20
  conforms_true: 17
  conforms_false: 5
  unknown: 1
  headline: >-
    athenahealth is a genuinely standards-forward FHIR implementer — R4 with US Core 3.1.1 and
    6.1.0, Bulk Data 1.0.1 and 2.0.0, SMART App Launch 2.0 with both v1 and v2 scope syntaxes, and
    a live anonymous CapabilityStatement — while its proprietary athenaOne v1 REST surface carries
    none of the cross-cutting HTTP conventions (Problem Details, Idempotency-Key, RateLimit
    headers) that an agent would need to call it safely.
