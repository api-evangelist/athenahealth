description: >-
  Standards conformance for the athenahealth API surface. The strongest evidence here is not
  documentation prose — it is the live FHIR CapabilityStatement athenahealth serves anonymously at
  https://api.platform.athenahealth.com/fhir/r4/metadata (HTTP 200, application/fhir+json, 75,902
  bytes) and the SMART App Launch configuration at .../fhir/r4/.well-known/smart-configuration
  (HTTP 200). Both were fetched unauthenticated on 2026-08-14 and are saved verbatim in this repo.
