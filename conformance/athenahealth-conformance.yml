standards:
- id: fhir
  name: HL7 FHIR R4
  conforms: true
  version: 4.0.1
  evidence: >-
    Live CapabilityStatement declares fhirVersion 4.0.1, status active, kind instance,
    software.name "athenahealth FHIR Server", implementation.url
    https://api.platform.athenahealth.com/fhir/r4, CapabilityStatement version 2.0.0 dated
    2022-06-06. 32 resource types are declared with read and/or search-type interactions.
  source: https://api.platform.athenahealth.com/fhir/r4/metadata
- id: us-core
  name: HL7 US Core Implementation Guide
  conforms: true
  version: 3.1.1 and 6.1.0
  evidence: >-
    CapabilityStatement.instantiates lists
    http://hl7.org/fhir/us/core/CapabilityStatement/us-core-server|3.1.1 and |6.1.0;
    implementationGuide lists hl7.fhir.us.core|6.1.0. 20 resources carry a supportedProfile
    pointing at a us-core-* StructureDefinition at 6.1.0.
  source: https://api.platform.athenahealth.com/fhir/r4/metadata
- id: fhir-bulk-data
  name: HL7 FHIR Bulk Data Access (Flat FHIR)
  conforms: true
  version: 1.0.1 and 2.0.0
  evidence: >-
    CapabilityStatement.instantiates lists
    http://hl7.org/fhir/uv/bulkdata/CapabilityStatement/bulk-data|1.0.1 and |2.0.0;
    implementationGuide lists hl7.fhir.uv.bulkdata at both versions. The Group resource declares
    the $export operation.
  source: https://api.platform.athenahealth.com/fhir/r4/metadata
- id: smart-on-fhir
  name: SMART App Launch
  conforms: true
  version: '2.0'
  evidence: >-
    .well-known/smart-configuration returns a real JSON object whose capabilities array contains
    launch-ehr, launch-standalone, client-confidential-symmetric, client-confidential-asymmetric,
    client-public, sso-openid-connect, context-ehr-patient, context-ehr-encounter, authorize-post,
    context-standalone-patient, permission-offline, permission-patient, permission-user,
    permission-v1, permission-v2, context-banner, context-style and health-cards. permission-v1
    AND permission-v2 both present means both the legacy (patient/*.read) and v2
    (patient/*.rs) scope syntaxes are accepted.
  source: https://api.platform.athenahealth.com/fhir/r4/.well-known/smart-configuration
- id: oauth2
  name: OAuth 2.0
  conforms: true
  evidence: >-
    smart-configuration declares authorization_endpoint, token_endpoint, introspection_endpoint
    (RFC 7662), revocation_endpoint (RFC 7009) and jwks_uri. grant_types_supported =
    [authorization_code, client_credentials]. token_endpoint_auth_methods_supported =
    [client_secret_basic, client_secret_post, client_secret_jwt, private_key_jwt, none].
  source: https://api.platform.athenahealth.com/fhir/r4/.well-known/smart-configuration
- id: oauth2-pkce
  name: PKCE (RFC 7636)
  conforms: true
  evidence: code_challenge_methods_supported = ["S256"] in the SMART configuration.
  source: https://api.platform.athenahealth.com/fhir/r4/.well-known/smart-configuration
- id: oidc
  name: OpenID Connect
  conforms: true
  evidence: >-
    SMART capabilities include sso-openid-connect; response_types_supported includes id_token,
    code id_token, id_token token and code id_token token; issuer is
    https://athena.okta.com/oauth2/aus2hff5eqFb7Wqfh297. NOTE: no /.well-known/openid-configuration
    document is served on any athenahealth host — the OIDC metadata is only reachable via the
    SMART configuration and the Okta issuer.
  source: https://api.platform.athenahealth.com/fhir/r4/.well-known/smart-configuration
- id: smart-backend-services
  name: SMART Backend Services Authorization (asymmetric client auth)
  conforms: true
  evidence: >-
    token_endpoint_auth_methods_supported includes private_key_jwt, and the SMART capabilities
    array includes client-confidential-asymmetric. This is the grant the Bulk Data and FHIR
    Subscriptions surfaces use.
  source: https://api.platform.athenahealth.com/fhir/r4/.well-known/smart-configuration
- id: cds-hooks
  name: CDS Hooks
  conforms: true
  version: '1.0'
  evidence: >-
    athenahealth publishes an athenaOne CDS Hooks Integration Guide
    (https://docs.athenahealth.com/downloads/athenaone-cds-hooks-integration-guide) and the repo
    carries a CDS Hooks discovery/invoke contract at openapi/athenahealth-cds-hooks-api-openapi.yml.
    The servers[] entry in that spec is https://cds.example.com because in CDS Hooks the SERVER is
    the third party's decision-support service, not athenahealth — athenahealth is the client.
  source: https://docs.athenahealth.com/downloads/athenaone-cds-hooks-integration-guide
- id: fhir-subscriptions
  name: FHIR Subscriptions (R5 Backport on R4, rest-hook channel)
  conforms: true
  evidence: >-
    athenahealth publishes a reference webhook receiver at
