  detail: lifecycle/athenahealth-lifecycle.yml
error_envelope:
  athenaone_v1:
    shape: unknown
    evidence: >-
      Not a single 4xx or 5xx response is declared across all 40 operations in openapi/. The
      athenaOne v1 error contract is undocumented in machine-readable form.
  fhir_r4:
    shape: FHIR OperationOutcome
    content_type: application/fhir+json
    evidence: >-
      Required by FHIR R4, to which the live CapabilityStatement declares conformance
      (fhirVersion 4.0.1). Not RFC 9457 Problem Details.
  detail: errors/athenahealth-problem-types.yml
rate_limits:
  signalling: unknown
  headers: []
  evidence: >-
    No RateLimit-*, X-RateLimit-* or Retry-After header is declared in any spec or observed on any
    unauthenticated response. athenahealth documents limits in prose on the JS-rendered docs
    portal.
  detail: rate-limits/athenahealth-rate-limits.yml
content_types:
  athenaone_v1: [application/json]
  fhir_r4:
    request: [application/fhir+json, application/json]
    response: [application/fhir+json, application/json, application/json+fhir]
    evidence: CapabilityStatement.format lists json, application/json, application/json+fhir and
      application/fhir+json.
async_operations:
  bulk_data:
    kickoff: 'GET /Group/{id}/$export with Prefer: respond-async and Accept: application/fhir+json'
    poll: Content-Location header on the 202 points at the status endpoint
    evidence: >-
      Prefer and Accept are the only two header parameters declared anywhere in openapi/, and
      Content-Location is the only response header declared anywhere in openapi/ — both on the bulk
      export operation. This is the FHIR Bulk Data async pattern, and it is the one place
      athenahealth's contract does carry a runtime signal.
  events:
    style: FHIR Subscription, rest-hook channel, id-only payload
    delivery_deadline: subscriber must return 2xx within 2 seconds
    detail: asyncapi/athenahealth-fhir-subscriptions-asyncapi.yml
cors:
  fhir_r4: true
  evidence: CapabilityStatement.rest[0].security.cors is true.
agent_readiness_summary: >-
  The FHIR half of athenahealth is well-behaved and self-describing: anonymous CapabilityStatement,
  anonymous SMART configuration, cursor pagination, _include/_revinclude, a declared error resource
  and a documented async pattern. The athenaOne v1 half publishes none of that — no error contract,
  no paging contract, no idempotency, no rate-limit signal — and it is the half that holds the
  scheduling and revenue-cycle write operations.
