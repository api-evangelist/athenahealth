method: derived
source: openapi/_original/ (5 specs), https://api.platform.athenahealth.com/fhir/r4/metadata,
  https://api.platform.athenahealth.com/fhir/r4/.well-known/smart-configuration
description: >-
  Cross-cutting runtime semantics for the athenahealth API surface. athenahealth runs two very
  different APIs behind one gateway and they do NOT share conventions: the proprietary athenaOne v1
  REST API (tenant in the path, athena/service/* scopes, lowercase-concatenated parameter names)
  and the FHIR R4 API (RESTful FHIR, SMART scopes, FHIR search parameters, cursor pagination). Read
  every row below as "which of the two". Rows marked unknown are unknown because athenahealth's
  developer documentation at docs.athenahealth.com is a JavaScript single-page application that
  returns a 2,116-byte shell to every non-browser client, so its prose could not be read by
  machine.
surfaces:
- id: athenaone-v1
  name: athenaOne v1 REST API
  base: https://api.platform.athenahealth.com/v1/{practiceid}
  preview_base: https://api.preview.platform.athenahealth.com/v1/{practiceid}
- id: fhir-r4
  name: FHIR R4 API
  base: https://api.platform.athenahealth.com/fhir/r4
  preview_base: https://api.preview.platform.athenahealth.com/fhir/r4
auth:
  style: oauth2
  flows: [authorization_code, client_credentials]
  athenaone_v1_scopes: athena/service/Athenanet.MDP.*
  fhir_scopes: SMART on FHIR (patient/*.read, user/*.read, system/*.read, launch, launch/patient,
    fhirUser, openid, offline_access)
  scope_syntax: >-
    Both SMART v1 (patient/*.read) and SMART v2 (patient/*.rs) are accepted — the live
    smart-configuration capabilities array contains permission-v1 AND permission-v2.
  token_endpoint: https://api.platform.athenahealth.com/oauth2/v1/token
  authorization_endpoint: https://api.platform.athenahealth.com/oauth2/v1/authorize
  introspection_endpoint: https://api.platform.athenahealth.com/oauth2/v1/introspect
  revocation_endpoint: https://api.platform.athenahealth.com/oauth2/v1/revoke
  jwks_uri: https://api.platform.athenahealth.com/oauth2/v1/keys
  issuer: https://athena.okta.com/oauth2/aus2hff5eqFb7Wqfh297
  client_auth: [client_secret_basic, client_secret_post, client_secret_jwt, private_key_jwt, none]
  pkce: 'S256 (code_challenge_methods_supported)'
  bearer: 'Authorization: Bearer <access_token>'
  detail: authentication/athenahealth-authentication.yml, scopes/athenahealth-scopes.yml
tenancy:
  athenaone_v1: >-
    The practice is a PATH SEGMENT, not a header or a query parameter: every athenaOne v1 URL is
    https://api.platform.athenahealth.com/v1/{practiceid}/... The server variable practiceid is
    declared in openapi/_original/athenahealth-athenaone-rest-api-openapi.yml with default 195900.
    An agent that does not bind practiceid cannot construct a single valid athenaOne v1 URL.
  fhir_r4: >-
    Tenancy is expressed as FHIR search parameters instead. The live CapabilityStatement declares
    athenahealth-specific tenancy search parameters on most resources: ah-practice, ah-brand,
    ah-department, ah-provider-group and ah-chart-sharing-group. These are custom parameters, not
    US Core, and they are the FHIR equivalent of the v1 practiceid path segment.
idempotency:
  supported: false
  header: null
  evidence: >-
    No Idempotency-Key, X-Idempotency-Key or equivalent parameter is declared on ANY of the 40
    operations in openapi/, including createPatient, updatePatient, createSubscription,
    checkInAppointment, cancelAppointment, rescheduleAppointment, groupBulkExport,
    deleteSubscription and cancelBulkExport.
  consequence: >-
    A retried write against this API is a second write. For an EHR that means a duplicate patient
    registration or a double appointment action. Callers must build their own de-duplication —
    search before create, and treat a timeout on a write as an unknown outcome to be reconciled by
    read, not retried blind.
pagination:
  athenaone_v1:
    style: unknown
    evidence: >-
      The captured athenaOne v1 list responses (PatientList, AppointmentList, ClaimList,
      DepartmentList, EncounterList, DocumentList, ProviderList) are bare JSON arrays with no
      envelope, and no limit/offset/page parameter is declared on any list operation. athenahealth's
      real v1 paging convention is documented only in the JS-rendered docs portal, which is not
      machine-readable. Recorded unknown rather than guessed.
  fhir_r4:
    style: cursor
    params: [_count, cursor]
    evidence: >-
      Both _count and cursor appear as declared searchParam entries on nearly every searchable
      resource in the live CapabilityStatement (AllergyIntolerance, CarePlan, CareTeam, Condition,
      Coverage, Device, DiagnosticReport, DocumentReference, Encounter, Goal, Immunization,
      MedicationRequest, Observation, Patient, Procedure, ServiceRequest and more).
    response: Standard FHIR Bundle with Bundle.link[relation=next] carrying the cursor.
    note: >-
      cursor is an athenahealth-specific search parameter, not a FHIR core one. Clients must follow
      Bundle.link next rather than compute offsets.
field_selection:
  athenaone_v1: none declared
  fhir_r4:
    include: >-
      _include and _revinclude are declared on most resources. _revinclude=Provenance:target is
      supported on 22 resource types — that is the US Core Provenance requirement, and it is how a
      caller gets the write-attribution chain for a clinical record.
    search_include_examples:
    - DiagnosticReport:patient
    - DiagnosticReport:result
    - DocumentReference:custodian
    - MedicationRequest:medication
    - Condition:encounter
metadata:
  athenaone_v1: none declared
  fhir_r4: >-
    _security is declared as a search parameter on nearly every resource, and Condition adds
    ah-redact-inline-security. This is a data-sensitivity filter (42 CFR Part 2 / behavioral-health
    style redaction), not a generic metadata bag, and an agent that ignores it can retrieve
    restricted content it should not surface.
request_id:
  header: unknown
  evidence: >-
    No request-id, correlation-id or trace header is declared in any spec, and no unauthenticated
    response we observed (the FHIR /metadata and smart-configuration endpoints) carried one.
