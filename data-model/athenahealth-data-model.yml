description: >-
  Entity-relationship graph for the athenahealth data surface, derived from the CapabilityStatement
  athenahealth's own FHIR server publishes anonymously. This is the strongest data-model evidence
  available for athenahealth and it did not come from documentation — it came from the server. It
  declares 32 resource types, the athenahealth-specific StructureDefinition profile each one
  conforms to (canonical host fhir.athena.io), the US Core 6.1.0 profile each supports, the exact
  search parameters accepted, and the _include / _revinclude links that define how the resources
  join. Six custom FHIR $operations are declared that appear in no other athenahealth artifact.
key_findings:
  resource_types: 32
  athenahealth_profiles: 26
  us_core_profiled_resources: 20
  custom_fhir_operations: 6
  provenance_linked_resources: 22
  tenancy_dimensions:
  - ah-practice
  - ah-brand
  - ah-department
  - ah-provider-group
  - ah-chart-sharing-group
  tenancy_note: >-
    These five athenahealth-specific search parameters are the real shape of multi-tenancy on the
    FHIR surface, and they have no US Core equivalent. ah-chart-sharing-group in particular is the
    boundary that decides which practices can see a shared chart — an agent that omits it will
    silently retrieve across a sharing group it did not intend to span.
  sensitivity_note: >-
    _security is a declared search parameter on nearly every resource, and Condition additionally
    declares ah-redact-inline-security. These control retrieval of restricted content
    (behavioral-health / 42 CFR Part 2 style redaction). They are the most important parameters on
    this entire surface for anyone building an agent on top of it.
  coverage_gap: >-
    The repo's OpenAPI covers 12 of these 32 resource types and none of the 6 custom $operations.
    athenahealth's live server is substantially more capable than anything it documents in
    machine-readable form.
id_conventions:
  fhir: >-
    FHIR resource ids are opaque server-assigned strings. Cross-resource references use standard
    FHIR Reference elements ("Patient/{id}").
  athenaone_v1: >-
    The v1 API uses numeric athenahealth identifiers in path position — patientid, appointmentid,
    encounterid, departmentid, providerid, practiceid — and the practice id is a SERVER VARIABLE in
    the base URL, not a parameter. See conventions/athenahealth-conventions.yml.
