method: derived
source: openapi/ (22 refined specs, 40 operations),
  https://api.platform.athenahealth.com/fhir/r4/metadata
status: candidate
description: >-
  athenahealth ships NO callable MCP server. It has publicly announced one — athenahealth says it
  is piloting a Model Context Protocol server over the athenaOne platform APIs, and publishes a
  blog post on MCP servers and consumer AI — but as of this probe there is no endpoint URL, no
  install command and no package anywhere on athenahealth's public surface, and nothing an MCP
  client could connect to. The tools below are a CANDIDATE surface DERIVED from the 40 operations
  already captured in this repo's OpenAPI files plus the 32 resources in the live FHIR
  CapabilityStatement. They are a proposal, not a product. No endpoint was guessed and none is
  recorded.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: oauth
  verified: derived
  note: >-
    mode is none because nobody ships a server. auth is recorded as oauth because that is what any
    athenahealth MCP server would have to use — the whole API surface is OAuth 2.0 / SMART on FHIR
    with authorization_code and client_credentials, per
    https://api.platform.athenahealth.com/fhir/r4/.well-known/smart-configuration.
vendor_signal:
  status: announced-pilot
  claim: >-
    athenahealth has stated publicly that it is piloting an MCP server on athenaOne platform APIs
    to standardise communication between AI models and athenaOne.
  source: https://www.athenahealth.com/resources/blog/mcp-servers-securely-connect-to-consumer-ai
  probe_note: >-
    The athenahealth blog URL above returns HTTP 403 to non-browser clients (Akamai bot
    protection), so this claim is recorded from athenahealth's public statements as reported, not
    from a body we fetched. No endpoint, package or install command is named in any athenahealth
    source we could reach.
