description: >-
  Binds every candidate MCP tool to the OpenAPI operation that backs it, so an agent inherits that
  operation's real parameters and requestBody as the tool inputSchema instead of a hand-written
  guess. Confidence is high across the board for one reason only: the tool list in
  mcp/athenahealth-mcp.yml was itself derived FROM these operations, so the binding is definitional
  rather than inferred. It is not evidence that athenahealth ships these tools — athenahealth ships
  no MCP server at all. The value of this file is the reverse direction: it shows exactly which
  parts of the athenahealth surface an MCP server would and would not cover.
