description: >-
  athenahealth publishes NO first-party client SDK on any public package registry. Every registry
  was queried unauthenticated on 2026-08-14 — npm, PyPI, RubyGems, NuGet, Packagist, crates.io and
  the Go module proxy — and every athenahealth-related package found is third-party. The
  athenahealth GitHub organisation (53 repos) ships sample applications and forks (mdp,
  aone-fhir-subscriptions, apiserver-athenaFlex, vscode-cql-extension, plus forks of hapi-fhir and
  the ONC g(10) test kit) but no distributable client library. Consumers of the athenaOne v1 REST
  API and the FHIR R4 API are expected to write their own HTTP client or adopt a community
  package, none of which athenahealth endorses.
