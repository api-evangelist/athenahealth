description: >-
  athenahealth ships a real, separately-hosted preview environment — not a mock, not a
  test-mode flag on production. Preview is a parallel deployment on its own hostname with its own
  OAuth issuer, its own token endpoint and its own FHIR server, and it answers anonymously. This
  was verified live rather than read from documentation, because athenahealth's sandbox
  documentation page is JS-rendered and could not be read by machine.
mode: separate-environment
environments:
- name: production
  athenaone_v1: https://api.platform.athenahealth.com/v1/{practiceid}
  fhir: https://api.platform.athenahealth.com/fhir/r4
  token: https://api.platform.athenahealth.com/oauth2/v1/token
  authorize: https://api.platform.athenahealth.com/oauth2/v1/authorize
  verified: true
