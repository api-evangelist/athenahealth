switching:
  method: hostname
  detail: >-
    There is no test-mode header, no test key prefix and no environment parameter. A client moves
    between environments by changing the hostname — api.platform.athenahealth.com becomes
    api.preview.platform.athenahealth.com — and by using the credentials issued for that
    environment. Credentials are NOT portable between environments; each has its own OAuth issuer.
  key_prefixes: none published
  note: >-
    athenahealth publishes no live-vs-test key prefix convention (unlike, say, Stripe's sk_test_ /
    sk_live_). The only way a client can tell which environment a credential belongs to is which
    host it was issued for. That is a real hazard: an accidental production credential in a test
    config fails closed, but an accidental production HOST in a test config does not.
test_data:
  provided: true
  form: shared preview practice
  practice_id_default: '195900'
  evidence: >-
    The server variable practiceid in
    openapi/_original/athenahealth-athenaone-rest-api-openapi.yml declares default '195900' for
    both the production and preview servers, described as "athenaOne preview practice identifier"
    on the preview entry. This is the well-known athenahealth preview practice.
  note: >-
    Preview is populated with athenahealth-provided synthetic patient data. The specific test
    patient identifiers, test insurance packages and test provider ids are documented only inside
    the JS-rendered developer portal and are not reproduced here — this pipeline does not invent
    test values.
test_cards: null
test_clocks: null
fixtures: null
not_applicable_note: >-
  Test cards, test clocks and fixture/trigger tooling are payments-provider constructs and have no
  athenahealth equivalent. athenahealth is an EHR and revenue-cycle platform; its sandbox analogue
  is a synthetic patient population in a shared preview practice.
docs:
