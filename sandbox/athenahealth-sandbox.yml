  onboarding: https://docs.athenahealth.com/api/guides/onboarding-overview
  machine_readable: false
  note: All three return the JS-rendered document-portal shell to machine clients.
access:
  self_service: false
  detail: >-
    Preview access is not self-service. A developer must register through the athenahealth
    Developer Portal / Marketplace Partner program and be approved before credentials are issued
    for either environment. See plans/athenahealth-plans-pricing.yml.
