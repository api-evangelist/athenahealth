description: >-
  athenahealth runs a dedicated trust center at trust.athenahealth.com, hosted on Vanta, and
  separately publishes a plain-language certifications page on its own corporate site. The two are
  complementary: the corporate page NAMES the certifications and is fully machine-readable; the
  trust center holds the actual attestation documents and gates them behind a request form.
trust_center:
  url: https://trust.athenahealth.com/
  verified: true
  http_status: 200
  content_type: text/html
  fetched: '2026-08-14'
  platform: Vanta
  platform_evidence: >-
    Page is served from a Vanta-built SPA — data-signature-manifest-url points at
    assets.vanta.com, og:image at app.vanta.com/doc, and the document carries a Vanta slug id
    (pvi3eaq3v84f6ph50je5).
  self_description: >-
    "The Trust Center is a self-service portal that allows clients to request and download our
    latest security certifications attestations and audit reports on a by request basis. If you
    require additional assistance in regards to a specific security or risk related question,
    please contact your athenahealth Customer Success Team member or a member of the Trust and
    Assurance team." (verbatim from the page's own meta description)
  documents_gated: true
  gating: request-based — attestations and audit reports are downloadable only on request
  machine_readable_certification_list: false
  machine_readable_note: >-
    The trust center body is a 5,337-byte SPA shell; the certification tiles are rendered
    client-side and no anonymous JSON endpoint returns them. Every /api/* path probed on
    trust.athenahealth.com and app.vanta.com returned the same shell. The certifications recorded
    below therefore come from athenahealth's own corporate certifications page, which IS readable,
    not from the trust center.
