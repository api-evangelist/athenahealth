shared_guardrails:
- No operation on any athenahealth surface accepts an idempotency key. A retried write is a second
  write. On timeout, reconcile by read.
- The athenaOne v1 specification declares zero 4xx and zero 5xx responses. Any non-2xx is an
  unknown outcome, not a classified failure.
- FHIR errors are OperationOutcome, not RFC 9457 Problem Details.
- FHIR pagination is cursor-based (_count + cursor); follow Bundle.link next. athenaOne v1 paging is
  undocumented.
- Always carry the athenahealth tenancy search parameters on FHIR searches (ah-practice, ah-brand,
  ah-department, ah-provider-group, ah-chart-sharing-group) and never strip _security filters.
- Develop against https://api.preview.platform.athenahealth.com — a genuinely separate environment
  with its own OAuth issuer and non-portable credentials.
- api.athenahealth.com does not resolve (NXDOMAIN, checked 2026-08-14). The host is
  api.platform.athenahealth.com.
