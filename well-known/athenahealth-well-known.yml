description: >-
  Probe of the standard /.well-known/ surface across every athenahealth host named in apis.yml
  and in the OpenAPI servers[] blocks. The root /.well-known/ paths return nothing real on any
  host: api.platform.athenahealth.com 404s every path, www.athenahealth.com and fhir.athena.io
  404 every path, and docs.athenahealth.com and mydata.athenahealth.com answer 200 to EVERY
  /.well-known/* path with the same single-page-application HTML shell (a catch-all route, not a
  document). The one real, machine-readable well-known document athenahealth serves is the SMART
  App Launch configuration published UNDER the FHIR base path rather than at the host root, at
  /fhir/r4/.well-known/smart-configuration on both the production and preview API hosts.
